server {
    listen 80;
    root /usr/share/nginx/html;

    # Адреса страниц и API не уходят на сторонние сайты в Referer. add_header из server не наследуется
    # в location, где есть свои add_header, поэтому заголовок повторён там.
    add_header Referrer-Policy "no-referrer" always;

    # Адрес API разрешается на каждый запрос (через переменную), чтобы nginx стартовал без api
    # и переживал пересоздание его контейнера. Префикс /api снимается, query string сохраняется.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Имена файлов в assets/ содержат хеш содержимого.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
